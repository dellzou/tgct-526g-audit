[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgct526g-audit"
version = "0.2.0"
description = "电信天翼TGCT526G宽带账号及超密获取软件（M1 只读检测：LuCI 登录、宽带凭据读取、默认超管检测）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dellzou" }]
keywords = ["tgct-526g", "tianyi", "luci", "router-security", "cpe"]
dependencies = []

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pillow>=10"]

[project.scripts]
tgct526g = "tgct526g.app:main"

[tool.setuptools.packages.find]
where = ["src"]
